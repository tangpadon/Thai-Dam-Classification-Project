services:
  - type: web
    name: streamlit-weka-app  # ตั้งชื่อแอปของคุณตามต้องการ
    runtime: python
    buildCommand: |
      # 1. อัปเดตแพ็กเกจและติดตั้ง Java OpenJDK ลงในระบบจำลองของ Render
      apt-get update && apt-get install -y openjdk-11-jdk
      # 2. ติดตั้งไลบรารี Python ตามปกติ
      pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: JAVA_HOME
        value: /usr/lib/jvm/java-11-openjdk-amd64
